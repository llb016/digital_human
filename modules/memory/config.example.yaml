# ============================================================
# 统一配置文件（扁平格式 —— 与团队 config.yaml 完全同构）
#
# 【Iter 20 决策：配置格式统一以团队为准】
#   团队 config.yaml 使用扁平 key，这是全队唯一对外的配置格式。
#   本模块内部虽用嵌套分节组织，但那只是实现细节，**不要求团队接受**。
#   因此本文件每一项都是扁平键，团队原有 5 个键原样保留、含义不变。
#
#   本模块会「向上逐级」查找 config.yaml 并**只读**适配，因此
#   <repo>/module2_user_profile_rag/ 与 <repo>/modules/memory/ 两种布局都能命中；
#   团队文件**不会被本模块修改**。
#
#   注意：扁平键名不得与内部节名同名（model/embedding/memory/profile/persona/emotion），
#   否则会覆盖整个分节。例如指定人设请写 default_persona，不要写 persona。
# ============================================================

# ------------------------------------------------------------
# 一、大模型（团队原有键：model_path / max_new_tokens / temperature）
# ------------------------------------------------------------
# 团队真实 config.yaml 里由队长设置为本地权重目录（如 "./model/qwen2.5"）。
# 本文件作为**模板**默认注释掉：置空/注释即退回可离线运行的 mock 后端，
# 这样在没下载权重的机器上也能跑自测与 --mock 交互。
# 一旦启用（存在该键），模块会自动切换到 transformers_local 后端。
# model_path: "./model/qwen2.5"
max_new_tokens: 200              # 生成长度上限（对话场景 60~80 通常够用，调小可提速）
temperature: 0.7                 # 情感陪伴建议 0.7~0.9，过低会显得生硬

# 本模块补充项
device: auto                     # auto / cpu / cuda
dtype: auto                      # auto / float32 / bfloat16
                                 #   auto = CPU 用 float32、有 GPU 才按权重精度。
                                 #   原因：本机 CPU 无 AVX512-BF16，bf16 是软件模拟，
                                 #   实测同 prompt 同输出 bf16 22.5s vs fp32 8.0s（慢 2.8 倍）

# ------------------------------------------------------------
# 二、情感识别（成员1 模块）
# ------------------------------------------------------------
emotion_threshold: 0.6           # 团队原有键：成员1 的判定阈值（本模块不消费，仅保留兼容）

# 成员1 的标签集。本模块**仅用于观测**：实际收到的标签若不在此列，会记录到
# unseen_labels 供核对口径，但**绝不拦截、不拒绝**（逐轮情绪一律以成员1 传入为准）。
emotion_labels: [开心, 平静, 焦虑, 悲伤, 愤怒, 孤独, 疲惫, 未知]

# ------------------------------------------------------------
# 三、向量与记忆（团队原有键：embedding_model / vector_db_path）
# ------------------------------------------------------------
embedding_model: "all-MiniLM-L6-v2"   # 团队选定，保持不变
vector_db_path: "./memory_vector_db"  # 团队原有键；本模块用作记忆库持久化路径

# 本模块补充项
embedding_backend: sentence_transformers  # sentence_transformers / hashing / api
                                          # 缺依赖时自动降级 hashing 并告警一次
ngram_min: 1                     # 哈希嵌入 n-gram 下界（降级时生效）
ngram_max: 2                     # 上界；实测 1-2 优于 1-3
function_word_weight: 0.15       # 纯虚词 n-gram 降权：抑制"你我/的什/什么/吗"造成的虚假相似度
memory_top_k: 5                  # 每轮召回记忆条数
similarity_threshold: 0.10       # 绝对下限：仅筛除"完全无关"
relative_ratio: 0.8              # 相对下限：只保留与最佳命中同量级的（0 = 关闭）
                                 # 绝对+相对双下限实测 Recall 0.800 / F1 0.828（纯绝对为 0.667/0.667）
max_dialogue_turns: 200          # 原始对话轮上限，超出后压缩为"事实记忆"
max_facts: 60                    # 事实记忆条数上限，超出后合并为摘要

# ------------------------------------------------------------
# 四、人设与对话生成
# ------------------------------------------------------------
default_persona: 温暖倾听者        # 温暖倾听者 / 理性朋友 / 元气鼓励师 / 治愈系陪伴
anti_hallucination: true          # 提示词层面的护栏（软约束）
                                  # 程序层面的硬约束见 src/anti_hallucination.py
                                  # （实体级拦截 + 句级观测，默认 enforce）
# 单轮回复的生成长度上限（安全网）。
#   ⚠️ 这是本模块内部的回复长度策略，**不修改团队 config.yaml 的 max_new_tokens**；
#      实际生效值 = min(本值, max_new_tokens)，即只会更严、不会更松。
#   实测（Iter 22）：生成长度是延迟主导因素（4.3~5.5 tok/s，预填充仅约 2s）。
#   设 80 会把较长的回复**截断在半句话上**，故取 120 兜住极端情况；
#   真正让回复变短靠护栏里的"2~3 句、60 字以内"约束（实测省 43% 时间且零截断）。
max_reply_tokens: 120

# ------------------------------------------------------------
# 五、用户画像
# ------------------------------------------------------------
profile_backend: heuristic        # heuristic（离线规则）/ llm（调用大模型，更准）
profile_dimensions_path: "profiles/profile_dimensions.yaml"
                                  # 17 维 / 6 大类；**只此一处定义**。成员3 评测请直接读它，
                                  # 保证评测口径与实现同源。
                                  # 其中"当前情绪"维度**已移除**：逐轮情绪以成员1 为准，
                                  # 本模块不再重复判断（避免同一 prompt 出现两个情绪标签）。
